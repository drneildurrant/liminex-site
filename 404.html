<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liminex</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://enter.liminex.ai/">
<!-- liminex.ai forwards to enter.liminex.ai (Neil, 2026-10-25). GitHub Pages cannot issue a
     server-side redirect, so this page does it: the script carries the path, query and hash
     across; the meta refresh is the fallback without script; the link is the fallback for both. -->
<meta http-equiv="refresh" content="0; url=https://enter.liminex.ai/">
<script>
  (function () {
    var target = "https://enter.liminex.ai" + location.pathname + location.search + location.hash;
    location.replace(target);
  })();
</script>
<style>
  html { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b0c0d; color: #d8dbdd; font: 300 18px/1.5 Spectral, Georgia, serif; text-align: center; padding: 24px; }
  a { color: #d8dbdd; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #cc2f3d; }
</style>
</head>
<body>
<p>Liminex has moved to <a href="https://enter.liminex.ai/">enter.liminex.ai</a>.</p>
</body>
